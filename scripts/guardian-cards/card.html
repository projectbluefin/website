<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Guardian card</title>
<style>
  /* Faithful static recreation of the wolves-intro guardian plate
     (src/components/wolves/WolvesIntroOverlay.vue) for 1200x630 OG cards. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #08090c;
    font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', monospace;
    color: #e2e8f0;
    position: relative;
  }
  /* Deep-space backdrop: subtle radial glow + starfield so the card isn't flat black. */
  .backdrop {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 90% 70% at 50% 110%, rgb(30 58 138 / 35%) 0%, transparent 60%),
      radial-gradient(ellipse 60% 45% at 50% 42%, rgb(96 165 250 / 12%) 0%, transparent 70%),
      #08090c;
  }
  /* === Subclass scene layer: original CSS/SVG evocations of each guardian's
     elemental subclass — no trailer imagery. === */
  /* Trailer still background (Bungie fan-content policy: non-commercial fan use). */
  .still {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
  }
  .still::after {
    content: '';
    position: absolute; inset: 0;
    /* Scrim keeps plate text legible over bright footage. */
    background:
      linear-gradient(to bottom, rgb(8 9 12 / 30%) 0%, rgb(8 9 12 / 10%) 40%, rgb(8 9 12 / 65%) 100%),
      radial-gradient(ellipse 85% 75% at 38% 50%, rgb(8 9 12 / 45%) 0%, transparent 70%);
  }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Void (Cortney — Voidwalker): deep purple nebula with drifting void orbs. */
  .scene.theme-void {
    background:
      radial-gradient(ellipse 75% 60% at 22% 30%, rgb(109 40 217 / 34%) 0%, transparent 65%),
      radial-gradient(ellipse 55% 45% at 78% 72%, rgb(76 29 149 / 30%) 0%, transparent 65%),
      radial-gradient(circle 130px at 84% 22%, rgb(167 139 250 / 22%) 0%, transparent 100%),
      radial-gradient(circle 70px at 12% 78%, rgb(139 92 246 / 20%) 0%, transparent 100%);
  }
  .scene.theme-void::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(circle 9px at 80% 25%, rgb(196 181 253 / 80%) 0%, rgb(139 92 246 / 35%) 45%, transparent 70%),
      radial-gradient(circle 5px at 88% 38%, rgb(196 181 253 / 65%) 0%, transparent 70%),
      radial-gradient(circle 7px at 15% 68%, rgb(196 181 253 / 60%) 0%, rgb(139 92 246 / 25%) 50%, transparent 75%),
      radial-gradient(circle 4px at 25% 80%, rgb(196 181 253 / 55%) 0%, transparent 70%);
  }
  /* Sentinel (Kat — Ward of Dawn): a violet bubble dome rising from the lower frame. */
  .scene.theme-sentinel {
    background: radial-gradient(ellipse 70% 55% at 50% 100%, rgb(91 33 182 / 26%) 0%, transparent 70%);
  }
  .scene.theme-sentinel::before {
    content: '';
    position: absolute; left: 50%; bottom: -550px; width: 1120px; height: 1120px;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 2px solid rgb(167 139 250 / 45%);
    background: radial-gradient(circle at 50% 50%, transparent 62%, rgb(139 92 246 / 14%) 78%, rgb(167 139 250 / 30%) 99%, rgb(221 214 254 / 55%) 100%);
    box-shadow: 0 0 60px rgb(139 92 246 / 35%), inset 0 0 90px rgb(139 92 246 / 25%);
  }
  .scene.theme-sentinel::after {
    content: '';
    position: absolute; left: 50%; bottom: -590px; width: 1180px; height: 1180px;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 1px solid rgb(196 181 253 / 22%);
  }
  /* Arc (Kaslin — Stormcaller): electric storm glow; bolts drawn in inline SVG. */
  .scene.theme-arc {
    background:
      radial-gradient(ellipse 60% 50% at 25% 18%, rgb(56 189 248 / 26%) 0%, transparent 65%),
      radial-gradient(ellipse 50% 45% at 80% 60%, rgb(14 116 144 / 24%) 0%, transparent 70%);
  }
  /* Solar (Laura — Gunslinger): golden-hour flare and rising embers. */
  .scene.theme-solar {
    background:
      radial-gradient(ellipse 80% 65% at 50% 112%, rgb(194 65 12 / 38%) 0%, rgb(146 64 14 / 18%) 45%, transparent 70%),
      radial-gradient(circle 180px at 78% 30%, rgb(251 191 36 / 24%) 0%, transparent 100%),
      radial-gradient(ellipse 45% 35% at 15% 55%, rgb(217 119 6 / 18%) 0%, transparent 70%);
  }
  .scene.theme-solar::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(circle 4px at 20% 72%, rgb(253 186 116 / 85%) 0%, transparent 70%),
      radial-gradient(circle 3px at 30% 52%, rgb(251 146 60 / 75%) 0%, transparent 70%),
      radial-gradient(circle 5px at 72% 64%, rgb(253 186 116 / 80%) 0%, transparent 70%),
      radial-gradient(circle 3px at 82% 44%, rgb(251 146 60 / 70%) 0%, transparent 70%),
      radial-gradient(circle 4px at 60% 82%, rgb(253 186 116 / 70%) 0%, transparent 70%),
      radial-gradient(circle 3px at 12% 34%, rgb(251 146 60 / 60%) 0%, transparent 70%),
      radial-gradient(circle 4px at 90% 76%, rgb(253 186 116 / 65%) 0%, transparent 70%);
  }
  /* Strand (Christoph — Broodweaver): luminous green threads woven across the frame. */
  .scene.theme-strand {
    background:
      radial-gradient(ellipse 65% 55% at 70% 25%, rgb(21 128 61 / 26%) 0%, transparent 65%),
      radial-gradient(ellipse 50% 45% at 20% 80%, rgb(22 101 52 / 24%) 0%, transparent 70%);
  }
  /* Stasis (Natali — Behemoth): icy blue shard crystals jutting from the frame edges. */
  .scene.theme-stasis {
    background:
      radial-gradient(ellipse 70% 55% at 30% 100%, rgb(30 64 175 / 30%) 0%, transparent 70%),
      radial-gradient(ellipse 45% 40% at 85% 15%, rgb(103 232 249 / 14%) 0%, transparent 70%);
  }
  .scene .shard {
    position: absolute;
    background: linear-gradient(170deg, rgb(165 243 252 / 55%) 0%, rgb(59 130 246 / 30%) 45%, rgb(30 58 138 / 15%) 100%);
    border: 1px solid rgb(165 243 252 / 35%);
    clip-path: polygon(50% 0%, 100% 78%, 78% 100%, 22% 100%, 0% 78%);
    filter: drop-shadow(0 0 14px rgb(103 232 249 / 35%));
  }
  .backdrop::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 22%, rgb(255 255 255 / 55%) 50%, transparent 51%),
      radial-gradient(1px 1px at 27% 68%, rgb(255 255 255 / 35%) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 41% 15%, rgb(255 255 255 / 45%) 50%, transparent 51%),
      radial-gradient(1px 1px at 58% 81%, rgb(255 255 255 / 30%) 50%, transparent 51%),
      radial-gradient(1px 1px at 66% 33%, rgb(255 255 255 / 50%) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 78% 60%, rgb(255 255 255 / 40%) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 18%, rgb(255 255 255 / 45%) 50%, transparent 51%),
      radial-gradient(1px 1px at 8% 85%, rgb(255 255 255 / 35%) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 93% 78%, rgb(255 255 255 / 35%) 50%, transparent 51%),
      radial-gradient(1px 1px at 35% 45%, rgb(255 255 255 / 25%) 50%, transparent 51%),
      radial-gradient(1px 1px at 72% 8%, rgb(255 255 255 / 40%) 50%, transparent 51%),
      radial-gradient(1px 1px at 50% 92%, rgb(255 255 255 / 30%) 50%, transparent 51%);
  }
  .frame {
    position: absolute; inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 0 60px;
  }
  /* === Guardian plate: geometry/colors copied from .wolves-guardian-plate === */
  .plate {
    position: relative;
    max-width: 720px;
    padding: 42px 56px 38px;
    border: 1px solid rgb(147 197 253 / 45%);
    border-radius: 12px;
    clip-path: polygon(16px 0%, 100% 0%, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0% 100%, 0% 16px);
    background: rgb(8 12 20 / 82%);
    text-align: center;
    text-shadow: 0 2px 10px rgb(0 0 0 / 80%);
    flex: 0 1 auto;
  }
  .plate-header {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-bottom: 8px;
  }
  .horizon {
    flex: 1 1 auto; height: 2px; min-width: 32px;
    background: linear-gradient(to right, transparent, #93c5fd 60%, #fff 100%);
    box-shadow: 0 0 8px rgb(147 197 253 / 55%);
  }
  .horizon-right { background: linear-gradient(to left, transparent, #93c5fd 60%, #fff 100%); }
  .crest { width: 44px; height: 44px; flex: 0 0 auto; }
  .crest-outer { fill: none; stroke: #93c5fd; stroke-width: 2; }
  .crest-inner { fill: rgb(8 12 20 / 95%); stroke: #f5f5f5; stroke-width: 1; }
  .crest-chevron { fill: none; stroke: #93c5fd; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .label {
    margin: 0; font-size: 20px; letter-spacing: 0.35em; color: #93c5fd;
  }
  .class {
    margin: 6px 0 0; font-size: 26px; letter-spacing: 0.05em;
    color: #bfdbfe; text-transform: uppercase;
  }
  .name {
    margin: 4px 0 0; font-size: 54px; font-weight: 700;
    background: linear-gradient(to bottom, #fff 0%, #e2e8f0 60%, #a0aec0 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title {
    margin: 8px 0 0; font-size: 24px; color: #94a3b8;
  }
  .title-sep { display: inline-block; margin: 0 0.4em; color: #93c5fd; opacity: 0.85; }
  /* Trustee (burnished silver) treatment */
  .plate.trustee { border-color: rgb(203 213 225 / 55%); box-shadow: 0 0 24px rgb(226 232 240 / 20%); }
  .plate.trustee .horizon { background: linear-gradient(to right, transparent, #d1d5db 60%, #fff 100%); box-shadow: 0 0 8px rgb(226 232 240 / 55%); }
  .plate.trustee .horizon-right { background: linear-gradient(to left, transparent, #d1d5db 60%, #fff 100%); }
  .plate.trustee .crest { filter: drop-shadow(0 0 8px rgb(226 232 240 / 70%)); }
  .plate.trustee .crest-outer, .plate.trustee .crest-chevron { stroke: #d1d5db; }
  .plate.trustee .label { color: #e5e7eb; }
  .plate.trustee .title { color: #cbd5e1; }
  /* Leader (gold) treatment */
  .plate.leader { border-color: rgb(250 204 21 / 55%); box-shadow: 0 0 24px rgb(250 204 21 / 20%); }
  .plate.leader .horizon { background: linear-gradient(to right, transparent, #facc15 60%, #fff 100%); box-shadow: 0 0 8px rgb(250 204 21 / 55%); }
  .plate.leader .horizon-right { background: linear-gradient(to left, transparent, #facc15 60%, #fff 100%); }
  .plate.leader .crest { filter: drop-shadow(0 0 8px rgb(250 204 21 / 70%)); }
  .plate.leader .crest-outer, .plate.leader .crest-chevron { stroke: #facc15; }
  .plate.leader .label { color: #facc15; }
  .plate.leader .title { color: #fde68a; font-weight: 600; }
  /* === Companion plate: from .wolves-companion-plate === */
  .companion { position: relative; flex: 0 0 auto; width: 300px; text-align: center; }
  .companion-art {
    position: relative; z-index: 1; display: block;
    width: 108%; max-width: none; margin: 0 -4% -54px;
  }
  .companion-art--bob-torosaurus { width: 108%; margin-inline: -4%; }
  .companion-art--karl { width: 118%; margin-inline: -9%; }
  .companion-art--kentrosaurus { width: 104%; margin-inline: -2%; }
  .companion-art--alamosaurus { width: 124.2%; margin: 0 -12.1% -62px; }
  .companion-card {
    position: relative; padding: 66px 24px 22px;
    border: 1px solid rgb(147 197 253 / 45%); border-radius: 12px;
    clip-path: polygon(16px 0%, 100% 0%, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0% 100%, 0% 16px);
    background: rgb(8 12 20 / 82%);
    text-shadow: 0 2px 10px rgb(0 0 0 / 80%);
  }
  .companion-label { margin: 0; font-size: 17px; letter-spacing: 0.35em; color: #93c5fd; }
  .companion-name {
    margin: 5px 0 0; font-size: 34px; font-weight: 700;
    background: linear-gradient(to bottom, #fff 0%, #e2e8f0 60%, #a0aec0 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .companion-species { margin: 6px 0 0; font-size: 19px; font-style: italic; letter-spacing: 0.05em; color: #94a3b8; }
  /* Footer strip: campaign wordmark + call to action */
  .footer {
    position: absolute; bottom: 40px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    font-size: 17px; letter-spacing: 0.32em; text-transform: uppercase; color: #60a5fa;
    text-shadow: 0 1px 6px rgb(0 0 0 / 90%);
  }
  .footer .rule { width: 70px; height: 1px; background: rgb(96 165 250 / 40%); }
  .disclaimer {
    position: absolute; bottom: 14px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; letter-spacing: 0.08em; color: rgb(148 163 184 / 75%);
    text-shadow: 0 1px 4px rgb(0 0 0 / 90%);
  }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="still" id="still" style="display:none"></div>
  <div class="scene" id="scene"></div>
  <div class="frame">
    <div class="plate" id="plate">
      <div class="plate-header">
        <div class="horizon"></div>
        <svg class="crest" viewBox="0 0 100 100" aria-hidden="true">
          <polygon points="50,5 85,20 95,55 50,95 5,55 15,20" class="crest-outer" />
          <polygon points="50,12 78,25 87,52 50,85 13,52 22,25" class="crest-inner" />
          <path d="M35,45 L50,60 L65,45" class="crest-chevron" />
        </svg>
        <div class="horizon horizon-right"></div>
      </div>
      <p class="label" id="label"></p>
      <p class="class" id="class"></p>
      <p class="name" id="name"></p>
      <p class="title" id="title"></p>
    </div>
    <div class="companion" id="companion" style="display:none">
      <img class="companion-art" id="companion-art" alt="" />
      <div class="companion-card">
        <p class="companion-label">GUARDIAN BOND</p>
        <p class="companion-name" id="companion-name"></p>
        <p class="companion-species" id="companion-species"></p>
      </div>
    </div>
  </div>
  <div class="footer">
    <div class="rule"></div>
    <span>Seven Days to the Wolves &mdash; wolves.projectbluefin.io</span>
    <div class="rule"></div>
  </div>
  <div class="disclaimer">
    Destiny 2 &copy; Bungie, Inc. Fan-made, non-commercial community art &mdash; not affiliated with or endorsed by Bungie.
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    if (params.get('still')) {
      const still = document.getElementById('still')
      still.style.display = ''
      still.style.backgroundImage = `url(${JSON.stringify(params.get('still'))})`
    }
    const scene = document.getElementById('scene')
    const theme = params.get('theme')
    if (theme) {
      scene.classList.add(`theme-${theme}`)
      if (theme === 'arc') {
        // Hand-drawn jagged bolts, Stormcaller style.
        scene.innerHTML = `
          <svg viewBox="0 0 1200 630" preserveAspectRatio="none">
            <g fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M210,-10 L260,120 L228,138 L300,290 L268,300 L330,430" stroke="rgb(103 232 249 / 14%)" stroke-width="11"/>
              <path d="M210,-10 L260,120 L228,138 L300,290 L268,300 L330,430" stroke="rgb(165 243 252 / 75%)" stroke-width="2.5"/>
              <path d="M990,-20 L940,140 L985,160 L900,330 L940,345 L860,520" stroke="rgb(103 232 249 / 12%)" stroke-width="9"/>
              <path d="M990,-20 L940,140 L985,160 L900,330 L940,345 L860,520" stroke="rgb(165 243 252 / 60%)" stroke-width="2"/>
              <path d="M560,-15 L590,70 L565,84 L610,180" stroke="rgb(165 243 252 / 40%)" stroke-width="1.6"/>
              <path d="M100,200 L150,300 L122,312 L180,420" stroke="rgb(165 243 252 / 35%)" stroke-width="1.4"/>
            </g>
          </svg>`
      }
      if (theme === 'strand') {
        // Woven strand threads with node points.
        scene.innerHTML = `
          <svg viewBox="0 0 1200 630" preserveAspectRatio="none">
            <g fill="none">
              <path d="M-40,520 C260,330 620,430 1240,140" stroke="rgb(74 222 128 / 45%)" stroke-width="2.4"/>
              <path d="M-40,560 C300,390 640,480 1240,190" stroke="rgb(34 197 94 / 30%)" stroke-width="1.6"/>
              <path d="M-40,120 C380,300 760,180 1240,420" stroke="rgb(74 222 128 / 35%)" stroke-width="2"/>
              <path d="M-40,80 C420,260 800,150 1240,380" stroke="rgb(34 197 94 / 22%)" stroke-width="1.3"/>
              <path d="M-40,330 C400,260 780,360 1240,300" stroke="rgb(134 239 172 / 18%)" stroke-width="1"/>
            </g>
            <g fill="rgb(134 239 172 / 85%)">
              <circle cx="285" cy="345" r="4"/>
              <circle cx="812" cy="298" r="3.4"/>
              <circle cx="540" cy="238" r="3"/>
              <circle cx="1020" cy="255" r="2.6"/>
              <circle cx="140" cy="452" r="2.6"/>
            </g>
          </svg>`
      }
      if (theme === 'stasis') {
        // Ice shards rising from the lower corners.
        scene.innerHTML = `
          <div class="shard" style="left:-30px; bottom:-40px; width:150px; height:300px; transform: rotate(14deg);"></div>
          <div class="shard" style="left:90px; bottom:-60px; width:100px; height:210px; transform: rotate(-7deg);"></div>
          <div class="shard" style="right:-20px; bottom:-50px; width:170px; height:340px; transform: rotate(-16deg);"></div>
          <div class="shard" style="right:120px; bottom:-70px; width:110px; height:230px; transform: rotate(9deg);"></div>
          <div class="shard" style="right:60px; top:-120px; width:90px; height:220px; transform: rotate(171deg);"></div>`
      }
    }
    const plate = document.getElementById('plate')
    if (params.get('trustee') === '1') plate.classList.add('trustee')
    if (params.get('leader') === '1') plate.classList.add('leader')
    document.getElementById('label').textContent =
      params.get('label') || (params.get('trustee') === '1' ? 'TRUSTEE // GUARDIAN' : 'MAINTAINER // GUARDIAN')
    document.getElementById('class').textContent = params.get('class') || ''
    document.getElementById('name').textContent = params.get('name') || ''
    // Multi-segment titles use the blue UI separator, same as the overlay.
    const titleEl = document.getElementById('title')
    const segments = (params.get('title') || '').split(' — ')
    segments.forEach((segment, index) => {
      if (index > 0) {
        const sep = document.createElement('span')
        sep.className = 'title-sep'
        sep.textContent = '|'
        titleEl.appendChild(sep)
      }
      titleEl.appendChild(document.createTextNode(segment))
    })
    if (params.get('dinoArt')) {
      const companion = document.getElementById('companion')
      companion.style.display = ''
      const art = document.getElementById('companion-art')
      art.src = params.get('dinoArt')
      art.classList.add('companion-art--' + params.get('dinoId'))
      const nameEl = document.getElementById('companion-name')
      if (params.get('dinoName')) nameEl.textContent = params.get('dinoName')
      else nameEl.style.display = 'none'
      document.getElementById('companion-species').textContent = params.get('dinoSpecies') || ''
    }
  </script>
</body>
</html>
