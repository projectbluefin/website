name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore live data from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Must match the save step's path list in update-content.yml exactly,
          # order included: actions/cache derives the cache version from the
          # path list, so a mismatch silently restores nothing and every deploy
          # quietly ships the committed fallback data.
          path: |
            public/stream-versions.yml
            public/dakota-versions.json
            public/flickr-photos.json
            public/experiences
            src/assets/svg/growth_bluefins.svg
            .cache/website-live-data/sbom-audit.json
          key: website-live-data-
          restore-keys: |
            website-live-data-
          fail-on-cache-miss: false

      # catalogue.json is version-controlled, and only a local `npm run
      # update:back-catalogue` (yt-dlp) can build its track segments, so CI can
      # never hold a fresher catalogue than the committed one. This job restores
      # the same cache (path includes `public/experiences`) over the committed
      # catalogue, so a cache from before an ingest ships a site missing the new
      # album until the next daily run saves a fresh one. Restore the committed
      # catalogue over the cache, exactly as in update-content.yml.
      - name: Restore committed catalogue over cache
        run: git checkout HEAD -- public/experiences/catalogue.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
