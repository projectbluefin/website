name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Check agent documentation system
        run: npm run check:docs
      - run: npm run lint
      - run: npm run typecheck
      - name: Install playlist test dependency
        run: sudo apt-get update && sudo apt-get install --yes yt-dlp
      - run: npm run test:run -- --coverage
      - run: npm run build

  wolves-movie-flow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run Wolves movie flow browser test
        env:
          WOLVES_BROWSER_FIXTURES: '1'
        run: |
          npm run dev -- --host 127.0.0.1 &
          DEV_PID=$!
          for _ in $(seq 1 60); do
            if curl -s http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node tests/wolves-movie-flow.mjs
          RESULT=$?
          kill $DEV_PID
          exit $RESULT
